<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeBot - Mein Leben DB</title>

    <!-- Meta-Tags für App-Installation (Android & iOS Web App / PWA) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LifeBot">
    <meta name="theme-color" content="#11191f">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        /* Kompaktere Abstände für große Bildschirme */
        @media (min-width: 992px) {
            main.container {
                padding-top: 1rem;
                padding-bottom: 1rem;
            }
            h4 {
                margin-bottom: 0.75rem;
            }
            form {
                margin-bottom: 0;
            }
        }

        /* Umbruch statt Wischen: Buttons brechen bei Bedarf sauber in die nächste Zeile um */
        .filter-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .filter-buttons button {
            padding: 4px 10px;
            font-size: 0.8rem;
            white-space: nowrap;
            width: auto;
            margin: 0;
        }

        /* Detail-Akkordeon optisch verschönern */
        details {
            border: 1px solid #3b4b5c;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }
        details summary {
            font-weight: bold;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        details summary::-webkit-details-marker {
            display: none;
        }
        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            background: #3b4b5c;
            border-radius: 4px;
            color: #ffffff;
        }
        
        /* Aktions-Toolbar für jeden Eintrag */
        .item-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px dashed #3b4b5c;
            padding-top: 10px;
        }
        .item-actions button {
            padding: 2px 8px;
            font-size: 0.75rem;
            margin: 0;
            width: auto;
        }

        /* CATEGORY QUICK-CHIPS */
        .category-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .category-chips button {
            padding: 4px 12px;
            font-size: 0.8rem;
            width: auto;
            margin: 0;
        }

        /* INBOX KARUSSELL STYLES */
        .inbox-card {
            border: 2px solid #00895b;
            border-radius: 8px;
            padding: 1rem;
            background-color: #1a232a;
            margin-bottom: 1rem;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .inbox-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .inbox-nav button {
            width: auto;
            margin: 0;
            padding: 4px 12px;
            font-size: 0.85rem;
        }
        .inbox-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 8px;
            margin-top: 1rem;
        }
        .inbox-actions button {
            margin: 0;
            padding: 8px;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="container">
        
        <!-- Header (Schlicht und minimalistisch) -->
        <nav style="margin-bottom: 1rem;">
            <ul>
                <li><strong>LifeBot 🤖</strong></li>
            </ul>
        </nav>

        <!-- DYNAMISCHES INBOX KARUSSELL BANNER -->
        <section id="inboxCollapseSection" style="display: none; border: 2px solid #00895b; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; background-color: #1a232a;">
            <div style="font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;" onclick="toggleInboxCarousel()">
                <span>📥 Inbox aufräumen (<span id="inboxCountText">0</span>)</span>
                <span id="inboxToggleArrow" style="font-size: 1.2rem;">▼</span>
            </div>
            <div id="inboxCarouselWrapper">
                <!-- Wird dynamisch befüllt -->
            </div>
        </section>

        <!-- EINTRAGEN-BEREICH (Quick-Add) -->
        <section id="writeSection" style="margin-bottom: 2rem;">
            <h4 id="formTitle" style="margin-bottom: 0.5rem;">Gedanke festhalten</h4>
            <form id="entryForm">
                <textarea id="content" style="height: 110px; margin-bottom: 0.75rem; resize: none;" placeholder="Hier unstrukturierte Gedanken eintragen... (Erste Zeile wird automatisch zum Titel)" required></textarea>
                
                <!-- Kategorieauswahl und Absendebuttons in einer Zeile -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px;">
                    
                    <!-- Linke Seite: Aktiv & Merken Chips -->
                    <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                        <span style="font-size: 0.8rem; color: gray;">Zuweisen:</span>
                        <div class="category-chips">
                            <button type="button" class="outline secondary" data-val="1" onclick="selectFormCategory(1)">⚡ Aktiv</button>
                            <button type="button" class="outline secondary" data-val="2" onclick="selectFormCategory(2)">🧠 Merken</button>
                        </div>
                    </div>

                    <!-- Rechte Seite: Abbrechen & Speichern Buttons -->
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button type="button" id="cancelBtn" class="secondary outline" style="margin: 0; display: none; width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="resetForm()">Abbrechen</button>
                        <button type="submit" id="submitBtn" style="margin: 0; width: auto; padding: 6px 16px; font-size: 0.8rem;">Festhalten</button>
                    </div>

                </div>
            </form>
        </section>

        <!-- SUCHEN & FEED-BEREICH -->
        <section id="readSection" style="border-top: 1px solid #3b4b5c; padding-top: 1.5rem;">
            <h4 style="margin-bottom: 0.5rem;">🔍 Suchen & Finden</h4>
            
            <!-- Live-Suchfeld -->
            <input type="search" id="searchInput" placeholder="Suche nach Inhalten..." oninput="renderEntries()">

            <!-- Schnellfilter nach Kategorien -->
            <div class="filter-buttons">
                <button class="secondary" id="btnFilterAll" onclick="filterCategory(null)">Alle</button>
                <button class="outline secondary" id="btnFilterInbox" onclick="filterCategory('inbox')">Inbox</button>
                <button class="outline secondary" id="btnFilter1" onclick="filterCategory(1)">Aktiv</button>
                <button class="outline secondary" id="btnFilter2" onclick="filterCategory(2)">Merken</button>
            </div>

            <!-- Die kompakte Feed-Liste -->
            <div id="entriesList">Lade Einträge...</div>
        </section>

    </main>

    <script>
        const form = document.getElementById('entryForm');
        const list = document.getElementById('entriesList');
        
        let allItems = []; // Alle Einträge aus der DB
        let inboxItems = []; // Nur unsortierte Inbox-Einträge
        let currentInboxIndex = 0; // Aktueller Index im Karussell
        let currentFilterCategory = null; // Filter im Suchen-Bereich
        
        let selectedFormCategoryId = null; // Ausgewählte Kategorie im Quick-Add-Formular (null = Inbox)
        let editingItemId = null; // ID des Eintrags im Bearbeitungsmodus
        let showInboxCarousel = false; // Karussell standardmäßig eingeklappt

        // Hilfsfunktion: Formular vollständig zurücksetzen
        function resetForm() {
            form.reset();
            editingItemId = null;
            selectedFormCategoryId = null;
            
            // Alle Aktiv-Zustände der Chips entfernen (standardmäßig Inbox)
            const buttons = document.querySelectorAll('.category-chips button');
            buttons.forEach(btn => btn.classList.add('outline'));
            
            document.getElementById('formTitle').innerText = 'Gedanke festhalten';
            document.getElementById('submitBtn').innerText = 'Festhalten';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // Steuert die Aktivierung und das Ausschalten (Toggle) der Quick-Chips
        function selectFormCategory(categoryId) {
            if (selectedFormCategoryId === categoryId) {
                selectedFormCategoryId = null; // Erneut klicken wählt die Kategorie ab -> Inbox
            } else {
                selectedFormCategoryId = categoryId;
            }

            const buttons = document.querySelectorAll('.category-chips button');
            buttons.forEach(btn => {
                const val = parseInt(btn.getAttribute('data-val'));
                if (selectedFormCategoryId !== null && val === selectedFormCategoryId) {
                    btn.classList.remove('outline');
                } else {
                    btn.classList.add('outline');
                }
            });
        }

        // Steuert den Suchfilter für den Feed unten
        function filterCategory(categoryId) {
            currentFilterCategory = categoryId;
            
            const buttonIds = {
                'all': 'btnFilterAll',
                'inbox': 'btnFilterInbox',
                1: 'btnFilter1',
                2: 'btnFilter2'
            };

            let activeKey = 'all';
            if (categoryId === 'inbox') {
                activeKey = 'inbox';
            } else if (categoryId !== null) {
                activeKey = categoryId;
            }

            for (const key in buttonIds) {
                const btn = document.getElementById(buttonIds[key]);
                if (btn) {
                    if (key == activeKey) {
                        btn.classList.remove('outline');
                    } else {
                        btn.classList.add('outline');
                    }
                }
            }

            renderEntries();
        }

        // Eintrag speichern (Erstellen ODER Bearbeiten)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('content').value;
            const category_id = selectedFormCategoryId;

            let response;

            if (editingItemId) {
                // UPDATE (Titel wird im Backend anhand der 1. Zeile neu generiert)
                response = await fetch(`/api/items/${editingItemId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: "", content, category_id })
                });
            } else {
                // CREATE (Titelgenerierung erfolgt im Backend)
                response = await fetch('/api/items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: "", content, category_id })
                });
            }

            if (response.ok) {
                resetForm();
                loadEntries();
            } else {
                alert('Fehler beim Speichern');
            }
        });

        // Daten vom Server laden
        async function loadEntries() {
            try {
                const response = await fetch('/api/items');
                allItems = await response.json();
                
                // Filtern nach echten Inbox-Einträgen (category_id ist null)
                inboxItems = allItems.filter(item => item.category_id === null || item.category_id === undefined);
                
                // Banner steuern
                const banner = document.getElementById('inboxCollapseSection');
                document.getElementById('inboxCountText').innerText = inboxItems.length;
                
                if (inboxItems.length > 0) {
                    banner.style.display = 'block';
                } else {
                    banner.style.display = 'none';
                }

                renderEntries();
                renderInboxCarousel();
            } catch (err) {
                list.innerHTML = '<p>Fehler beim Laden der Daten.</p>';
            }
        }

        // ==========================================
        // DYNAMISCHES KARUSSELL
        // ==========================================

        function toggleInboxCarousel() {
            showInboxCarousel = !showInboxCarousel;
            const wrapper = document.getElementById('inboxCarouselWrapper');
            const arrow = document.getElementById('inboxToggleArrow');
            wrapper.style.display = showInboxCarousel ? 'block' : 'none';
            arrow.innerText = showInboxCarousel ? '▲' : '▼';
        }

        function renderInboxCarousel() {
            const container = document.getElementById('inboxCarouselWrapper');
            const wrapper = document.getElementById('inboxCarouselWrapper');
            wrapper.style.display = showInboxCarousel ? 'block' : 'none';

            if (inboxItems.length === 0) {
                return;
            }

            if (currentInboxIndex >= inboxItems.length) {
                currentInboxIndex = Math.max(0, inboxItems.length - 1);
            }

            const item = inboxItems[currentInboxIndex];

            container.innerHTML = `
                <div class="inbox-nav">
                    <button type="button" class="outline secondary" onclick="prevInboxCard()" ${currentInboxIndex === 0 ? 'disabled' : ''}>◀ Vorherige</button>
                    <span style="font-size: 0.85rem; color: gray;">Eintrag ${currentInboxIndex + 1} von ${inboxItems.length}</span>
                    <button type="button" class="outline secondary" onclick="nextInboxCard()" ${currentInboxIndex === inboxItems.length - 1 ? 'disabled' : ''}>Nächste ▶</button>
                </div>

                <div class="inbox-card">
                    <div>
                        <h3 style="margin-bottom: 0.5rem;">${item.title || 'Ohne Titel'}</h3>
                        <p style="white-space: pre-wrap; font-size: 0.95rem; margin-bottom: 0;">${item.content || 'Kein Inhalt vorhanden'}</p>
                    </div>
                    <div style="font-size: 0.75rem; color: gray; margin-top: 1rem; text-align: right;">
                        Empfangen: ${new Date(item.created_at).toLocaleString('de-DE')}
                    </div>
                </div>

                <p style="font-size: 0.85rem; margin-bottom: 0.5rem; text-align: center;">Schnell-Einsortieren:</p>
                <div class="inbox-actions">
                    <button onclick="quickAssignCategory(${item.id}, 1)" class="secondary">⚡ Aktiv</button>
                    <button onclick="quickAssignCategory(${item.id}, 2)" class="secondary">🧠 Merken</button>
                    <button onclick="deleteItem(${item.id}, true)" class="outline contrast">🗑️ Löschen</button>
                </div>
            `;
        }

        function nextInboxCard() {
            if (currentInboxIndex < inboxItems.length - 1) {
                currentInboxIndex++;
                renderInboxCarousel();
            }
        }

        function prevInboxCard() {
            if (currentInboxIndex > 0) {
                currentInboxIndex--;
                renderInboxCarousel();
            }
        }

        async function quickAssignCategory(itemId, newCategoryId) {
            try {
                const response = await fetch(`/api/items/${itemId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: "", category_id: newCategoryId })
                });

                if (response.ok) {
                    loadEntries();
                } else {
                    alert('Fehler beim Einsortieren.');
                }
            } catch (err) {
                alert('Netzwerkfehler.');
            }
        }

        // ==========================================
        // EDITIEREN & LÖSCHEN
        // ==========================================

        async function deleteItem(id, isFromCarousel = false) {
            if (!confirm('Möchten Sie diesen Eintrag wirklich unwiderruflich löschen?')) return;

            try {
                const response = await fetch(`/api/items/${id}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    if (isFromCarousel && currentInboxIndex > 0) {
                        currentInboxIndex--;
                    }
                    loadEntries();
                } else {
                    alert('Fehler beim Löschen des Eintrags.');
                }
            } catch (err) {
                alert('Netzwerkfehler beim Löschen.');
            }
        }

        function editItem(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) return;

            // Formular befüllen
            document.getElementById('content').value = item.content || '';
            
            // Chips passend zur geladenen Kategorie aktivieren
            selectedFormCategoryId = item.category_id;
            const buttons = document.querySelectorAll('.category-chips button');
            buttons.forEach(btn => {
                const val = parseInt(btn.getAttribute('data-val'));
                if (selectedFormCategoryId !== null && val === selectedFormCategoryId) {
                    btn.classList.remove('outline');
                } else {
                    btn.classList.add('outline');
                }
            });

            editingItemId = id;

            // UI für das Editieren anpassen
            document.getElementById('formTitle').innerText = 'Eintrag bearbeiten';
            document.getElementById('submitBtn').innerText = 'Änderungen speichern';
            document.getElementById('cancelBtn').style.display = 'block';

            // Sanft nach oben scrollen
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderEntries() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allItems.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchText) || 
                                      (item.content && item.content.toLowerCase().includes(searchText));
                
                let matchesCategory = true;
                if (currentFilterCategory === 'inbox') {
                    matchesCategory = (item.category_id === null || item.category_id === undefined);
                } else if (currentFilterCategory !== null) {
                    matchesCategory = item.category_id === currentFilterCategory;
                }
                
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: gray;">Keine Einträge gefunden.</p>';
                return;
            }

            list.innerHTML = filtered.map(item => `
                <details id="item-${item.id}">
                    <summary>
                        <span>${item.title}</span>
                        <span class="badge">${item.category_name}</span>
                    </summary>
                    <p style="white-space: pre-wrap; margin-top: 10px; border-top: 1px solid #3b4b5c; padding-top: 10px; margin-bottom: 10px;">${item.content || 'Kein Inhalt'}</p>
                    
                    <div class="item-actions">
                        <span style="font-size: 0.7rem; color: gray;">
                            Erstellt am: ${new Date(item.created_at).toLocaleString('de-DE')}
                        </span>
                        <div style="display: flex; gap: 8px;">
                            <button class="outline" onclick="editItem(${item.id})">✏️ Bearbeiten</button>
                            <button class="outline contrast" onclick="deleteItem(${item.id})">🗑️ Löschen</button>
                        </div>
                    </div>
                </details>
            `).join('');
        }

        // Initialisierung beim Laden der Seite
        resetForm();
        loadEntries();
    </script>
</body>
</html>
