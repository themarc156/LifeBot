<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeBot - Mein Leben DB</title>

    <!-- Meta-Tags für App-Installation (Android & iOS Web App / PWA) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LifeBot">
    <meta name="theme-color" content="#11191f">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        /* Kompaktere Abstände für große Bildschirme */
        @media (min-width: 992px) {
            main.container {
                padding-top: 1rem;
                padding-bottom: 1rem;
            }
            h2 {
                margin-bottom: 0.75rem;
            }
            form {
                margin-bottom: 0;
            }
        }

        /* Umbruch statt Wischen: Buttons brechen bei Bedarf sauber in die nächste Zeile um */
        .filter-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .filter-buttons button {
            padding: 4px 10px;
            font-size: 0.8rem;
            white-space: nowrap;
            width: auto;
            margin: 0;
        }

        /* Detail-Akkordeon optisch verschönern */
        details {
            border: 1px solid #3b4b5c;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }
        details summary {
            font-weight: bold;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        details summary::-webkit-details-marker {
            display: none;
        }
        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            background: #3b4b5c;
            border-radius: 4px;
            color: #ffffff;
        }
        
        /* Aktions-Toolbar für jeden Eintrag */
        .item-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px dashed #3b4b5c;
            padding-top: 10px;
        }
        .item-actions button {
            padding: 2px 8px;
            font-size: 0.75rem;
            margin: 0;
            width: auto;
        }

        /* INBOX KARUSSELL STYLES */
        .inbox-card {
            border: 2px solid #00895b;
            border-radius: 8px;
            padding: 1rem;
            background-color: #1a232a;
            margin-bottom: 1rem;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .inbox-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .inbox-nav button {
            width: auto;
            margin: 0;
            padding: 4px 12px;
            font-size: 0.85rem;
        }
        .inbox-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 1rem;
        }
        .inbox-actions button {
            margin: 0;
            padding: 8px;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="container">
        
        <!-- Navigation / Tab-Leiste ganz oben -->
        <nav style="margin-bottom: 1rem;">
            <ul>
                <li><strong>LifeBot</strong></li>
            </ul>
            <ul>
                <li><a href="#" id="navInbox" onclick="showTab('inbox')">📥 Inbox (<span id="inboxBadgeCount">0</span>)</a></li>
                <li><a href="#" id="navWrite" aria-current="page" onclick="showTab('write')">➕ Eintragen</a></li>
                <li><a href="#" id="navRead" onclick="showTab('read')">🔍 Finden</a></li>
            </ul>
        </nav>

        <!-- BEREICH 0: INBOX CLEANING -->
        <section id="inboxSection" style="display: none;">
            <h2>📥 Inbox aufräumen</h2>
            <div id="inboxContent">
                <!-- Wird dynamisch befüllt -->
            </div>
        </section>

        <!-- BEREICH 1: EINTRAGEN -->
        <section id="writeSection">
            <h2 id="formTitle">Neuer Eintrag</h2>
            <form id="entryForm">
                <div class="grid" style="margin-bottom: 0.5rem;">
                    
                    <!-- Linke Spalte auf Laptop / Oben auf Handy -->
                    <div>
                        <label for="title">Titel</label>
                        <input type="text" id="title" placeholder="z. B. Steuererklärung" required>

                        <label for="category">Kategorie</label>
                        <select id="category">
                            <option value="">📥 Inbox (Noch einsortieren)</option>
                            <option value="1">Aktuelle Pläne/Projekte</option>
                            <option value="2">Lebensorganisation</option>
                            <option value="3">Wissen & Hobbys</option>
                            <option value="4">Erledigtes</option>
                        </select>
                    </div>
                    
                    <!-- Rechte Spalte auf Laptop / Unten auf Handy -->
                    <div>
                        <label for="content">Notiz / Inhalt</label>
                        <textarea id="content" style="height: 185px; margin-bottom: 0; resize: none;" placeholder="Hier unstrukturierte Gedanken eintragen..."></textarea>
                    </div>

                </div>

                <div style="display: flex; gap: 10px; margin-top: 0.5rem;">
                    <button type="submit" id="submitBtn" style="margin: 0;">Speichern</button>
                    <button type="button" id="cancelBtn" class="secondary outline" style="margin: 0; display: none;" onclick="resetForm()">Abbrechen</button>
                </div>
            </form>
        </section>

        <!-- BEREICH 2: SUCHEN & LESEN -->
        <section id="readSection" style="display: none;">
            <!-- Live-Suchfeld -->
            <input type="search" id="searchInput" placeholder="Suche nach Titeln oder Inhalten..." oninput="renderEntries()">

            <!-- Schnellfilter nach Kategorien -->
            <div class="filter-buttons">
                <button class="secondary" id="btnFilterAll" onclick="filterCategory(null)">Alle</button>
                <button class="outline secondary" id="btnFilterInbox" onclick="filterCategory('inbox')">Inbox</button>
                <button class="outline secondary" id="btnFilter1" onclick="filterCategory(1)">Pläne</button>
                <button class="outline secondary" id="btnFilter2" onclick="filterCategory(2)">Organisation</button>
                <button class="outline secondary" id="btnFilter3" onclick="filterCategory(3)">Wissen</button>
                <button class="outline secondary" id="btnFilter4" onclick="filterCategory(4)">Erledigt</button>
            </div>

            <!-- Die kompakte Liste -->
            <div id="entriesList">Lade Einträge...</div>
        </section>

    </main>

    <script>
        const form = document.getElementById('entryForm');
        const list = document.getElementById('entriesList');
        
        let allItems = []; // Speichert alle geladenen Einträge lokal im Browser
        let inboxItems = []; // Speichert nur die unsortierten Inbox-Einträge (category_id === null)
        let currentInboxIndex = 0; // Aktueller Index im Karussell
        let currentFilterCategory = null; // Aktuell ausgewählte Filter-Kategorie im "Finden"-Tab
        let editingItemId = null; // ID des Eintrags, der gerade editiert wird (null = neuer Eintrag)

        // Funktion: Zwischen den Tabs wechseln
        function showTab(tabId) {
            document.getElementById('inboxSection').style.display = tabId === 'inbox' ? 'block' : 'none';
            document.getElementById('writeSection').style.display = tabId === 'write' ? 'block' : 'none';
            document.getElementById('readSection').style.display = tabId === 'read' ? 'block' : 'none';
            
            // Aktiv-Zustand in der Navigationsleiste anpassen
            document.getElementById('navInbox').setAttribute('aria-current', tabId === 'inbox' ? 'page' : 'false');
            document.getElementById('navWrite').setAttribute('aria-current', tabId === 'write' ? 'page' : 'false');
            document.getElementById('navRead').setAttribute('aria-current', tabId === 'read' ? 'page' : 'false');
            
            if (tabId === 'write' && !editingItemId) {
                resetForm();
            }

            if (tabId === 'read' || tabId === 'inbox') {
                loadEntries(); // Aktualisieren beim Tab-Wechsel
            }
        }

        // Hilfsfunktion: Formular in den Normalzustand zurückversetzen
        function resetForm() {
            form.reset();
            editingItemId = null;
            document.getElementById('formTitle').innerText = 'Neuer Eintrag';
            document.getElementById('submitBtn').innerText = 'Speichern';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // Funktion: Kategorie-Filter umschalten (im Finden-Tab)
        function filterCategory(categoryId) {
            currentFilterCategory = categoryId;
            
            const buttonIds = {
                'all': 'btnFilterAll',
                'inbox': 'btnFilterInbox',
                1: 'btnFilter1',
                2: 'btnFilter2',
                3: 'btnFilter3',
                4: 'btnFilter4'
            };

            let activeKey = 'all';
            if (categoryId === 'inbox') {
                activeKey = 'inbox';
            } else if (categoryId !== null) {
                activeKey = categoryId;
            }

            for (const key in buttonIds) {
                const btn = document.getElementById(buttonIds[key]);
                if (btn) {
                    if (key == activeKey) {
                        btn.classList.remove('outline');
                    } else {
                        btn.classList.add('outline');
                    }
                }
            }

            renderEntries();
        }

        // Funktion: Eintrag speichern (Erstellen ODER Bearbeiten)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const categoryValue = document.getElementById('category').value;
            const category_id = categoryValue ? parseInt(categoryValue) : null;
            const content = document.getElementById('content').value;

            let response;

            if (editingItemId) {
                response = await fetch(`/api/items/${editingItemId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, category_id, content })
                });
            } else {
                response = await fetch('/api/items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, category_id, content })
                });
            }

            if (response.ok) {
                resetForm();
                showTab('read');
            } else {
                alert('Fehler beim Speichern');
            }
        });

        // Funktion: Daten vom Server laden
        async function loadEntries() {
            try {
                const response = await fetch('/api/items');
                allItems = await response.json();
                
                // Filtern nach echten Inbox-Items (Kategorie ist null oder undefined)
                inboxItems = allItems.filter(item => item.category_id === null || item.category_id === undefined);
                document.getElementById('inboxBadgeCount').innerText = inboxItems.length;

                renderEntries();
                renderInboxCarousel();
            } catch (err) {
                list.innerHTML = '<p>Fehler beim Laden der Daten.</p>';
            }
        }

        // ==========================================
        // INBOX KARUSSELL LOGIK (Variante B)
        // ==========================================

        function renderInboxCarousel() {
            const container = document.getElementById('inboxContent');

            if (inboxItems.length === 0) {
                container.innerHTML = `
                    <article style="text-align: center; padding: 2rem;">
                        <h3>🎉 Inbox vollkommen leer!</h3>
                        <p style="color: gray;">Alle Notizen & Telegram-Nachrichten sind einsortiert.</p>
                    </article>
                `;
                return;
            }

            if (currentInboxIndex >= inboxItems.length) {
                currentInboxIndex = Math.max(0, inboxItems.length - 1);
            }

            const item = inboxItems[currentInboxIndex];

            container.innerHTML = `
                <div class="inbox-nav">
                    <button class="outline secondary" onclick="prevInboxCard()" ${currentInboxIndex === 0 ? 'disabled' : ''}>◀ Vorherige</button>
                    <span style="font-size: 0.85rem; color: gray;">Eintrag ${currentInboxIndex + 1} von ${inboxItems.length}</span>
                    <button class="outline secondary" onclick="nextInboxCard()" ${currentInboxIndex === inboxItems.length - 1 ? 'disabled' : ''}>Nächste ▶</button>
                </div>

                <div class="inbox-card">
                    <div>
                        <h3 style="margin-bottom: 0.5rem;">${item.title || 'Ohne Titel'}</h3>
                        <p style="white-space: pre-wrap; font-size: 0.95rem; margin-bottom: 0;">${item.content || 'Kein Inhalt vorhanden'}</p>
                    </div>
                    <div style="font-size: 0.75rem; color: gray; margin-top: 1rem; text-align: right;">
                        Empfangen: ${new Date(item.created_at).toLocaleString('de-DE')}
                    </div>
                </div>

                <p style="font-size: 0.85rem; margin-bottom: 0.5rem; text-align: center;">Einsortieren in Kategorie:</p>
                <div class="inbox-actions">
                    <button onclick="quickAssignCategory(${item.id}, 1)" class="secondary">Pläne</button>
                    <button onclick="quickAssignCategory(${item.id}, 2)" class="secondary">Organisation</button>
                    <button onclick="quickAssignCategory(${item.id}, 3)" class="secondary">Wissen/Hobby</button>
                    <button onclick="quickAssignCategory(${item.id}, 4)" class="contrast">✅ Erledigt</button>
                    <button onclick="deleteItem(${item.id}, true)" class="outline contrast">🗑️ Löschen</button>
                </div>
            `;
        }

        function nextInboxCard() {
            if (currentInboxIndex < inboxItems.length - 1) {
                currentInboxIndex++;
                renderInboxCarousel();
            }
        }

        function prevInboxCard() {
            if (currentInboxIndex > 0) {
                currentInboxIndex--;
                renderInboxCarousel();
            }
        }

        // Schnell-Zuweisung aus dem Karussell
        async function quickAssignCategory(itemId, newCategoryId) {
            try {
                const response = await fetch(`/api/items/${itemId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category_id: newCategoryId })
                });

                if (response.ok) {
                    loadEntries(); // Neu laden und UI aktualisieren
                } else {
                    alert('Fehler beim Zuweisen der Kategorie.');
                }
            } catch (err) {
                alert('Netzwerkfehler.');
            }
        }

        // ==========================================
        // LISTE & EDITIEREN
        // ==========================================

        async function deleteItem(id, isFromCarousel = false) {
            if (!confirm('Möchten Sie diesen Eintrag wirklich unwiderruflich löschen?')) return;

            try {
                const response = await fetch(`/api/items/${id}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    if (isFromCarousel && currentInboxIndex > 0) {
                        currentInboxIndex--; // Index verschieben, damit die UI nicht ins Leere greift
                    }
                    loadEntries();
                } else {
                    alert('Fehler beim Löschen des Eintrags.');
                }
            } catch (err) {
                alert('Netzwerkfehler beim Löschen.');
            }
        }

        function editItem(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) return;

            document.getElementById('title').value = item.title;
            document.getElementById('category').value = item.category_id !== null ? item.category_id : '';
            document.getElementById('content').value = item.content || '';

            editingItemId = id;

            document.getElementById('formTitle').innerText = 'Eintrag bearbeiten';
            document.getElementById('submitBtn').innerText = 'Änderung speichern';
            document.getElementById('cancelBtn').style.display = 'block';

            showTab('write');
        }

        function renderEntries() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allItems.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchText) || 
                                      (item.content && item.content.toLowerCase().includes(searchText));
                
                let matchesCategory = true;
                if (currentFilterCategory === 'inbox') {
                    matchesCategory = (item.category_id === null || item.category_id === undefined);
                } else if (currentFilterCategory !== null) {
                    matchesCategory = item.category_id === currentFilterCategory;
                }
                
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: gray;">Keine Einträge gefunden.</p>';
                return;
            }

            list.innerHTML = filtered.map(item => `
                <details id="item-${item.id}">
                    <summary>
                        <span>${item.title}</span>
                        <span class="badge">${item.category_name}</span>
                    </summary>
                    <p style="white-space: pre-wrap; margin-top: 10px; border-top: 1px solid #3b4b5c; padding-top: 10px; margin-bottom: 10px;">${item.content || 'Kein Inhalt'}</p>
                    
                    <div class="item-actions">
                        <span style="font-size: 0.7rem; color: gray;">
                            Erstellt am: ${new Date(item.created_at).toLocaleString('de-DE')}
                        </span>
                        <div style="display: flex; gap: 8px;">
                            <button class="outline" onclick="editItem(${item.id})">✏️ Bearbeiten</button>
                            <button class="outline contrast" onclick="deleteItem(${item.id})">🗑️ Löschen</button>
                        </div>
                    </div>
                </details>
            `).join('');
        }

        // Beim Starten direkt einmal laden
        loadEntries();
    </script>
</body>
</html>
